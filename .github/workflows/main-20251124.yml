name: Build wiliwili (Only NRO)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ssh_ubuntu:
        description: 'SSH connection to Ubuntu'
        required: false
        default: 'false'
      release:
        description: 'Push new release'
        required: false
        default: 'true'
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      DIST_NRO: ${{ steps.extract-version.outputs.DIST_NRO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract version from CMakeLists.txt
        id: extract-version
        run: |
          VERSION_MAJOR=$(grep -oP 'set\(VERSION_MAJOR "\K[^"]+' CMakeLists.txt)
          VERSION_MINOR=$(grep -oP 'set\(VERSION_MINOR "\K[^"]+' CMakeLists.txt)
          VERSION_REVISION=$(grep -oP 'set\(VERSION_REVISION "\K[^"]+' CMakeLists.txt)
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_REVISION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_NRO=wiliwili-NintendoSwitch-${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

  build-switch:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: opengl, suffix: "", nro_name: "wiliwili-opengl.nro" }
          - { driver: deko3d, suffix: "_deko3d", nro_name: "wiliwili-deko3d.nro" }
        driver: [opengl, deko3d]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: SSH connection
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh_ubuntu == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Disable unity build
        if: github.event.inputs.disable_unity_build == 'true'
        run: |
          sed -i 's/BRLS_UNITY_BUILD=ON/BRLS_UNITY_BUILD=OFF/' scripts/build_switch${{ matrix.suffix }}.sh

      - name: Build NRO
        run: |
          docker run --rm -v $(pwd):/data devkitpro/devkita64:latest bash -c "/data/scripts/build_switch${{ matrix.suffix }}.sh"

      - name: Rename NRO
        run: |
          mkdir -p cmake-build-switch
          sudo chown -R $USER:$USER cmake-build-switch/
          mv cmake-build-switch/wiliwili.nro cmake-build-switch/${{ matrix.nro_name }}

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nro_name }}
          path: "cmake-build-switch/${{ matrix.nro_name }}"
          retention-days: 90

  release-nro:
    needs: [version, build-switch]
    runs-on: ubuntu-latest
    if: github.event.inputs.release == 'true' || github.ref == 'refs/heads/yoga'
    steps:
      - name: Download NRO
        uses: actions/download-artifact@v4
        with:
          path: ./nro-files
          pattern: "wiliwili-*.nro"
          merge-multiple: true

      - name: Create ZIP package (OpenGL version)
        run: |
          mkdir -p switch/wiliwili
          cp ./nro-files/wiliwili-opengl.nro switch/wiliwili/wiliwili.nro
          zip -r wiliwili-NintendoSwitch.zip switch/

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili Switch v${{ needs.version.outputs.version }}
          tag: v${{ needs.version.outputs.version }}
          makeLatest: true
          omitBodyDuringUpdate: true
          body: |
            wiliwili Nintendo Switch NRO 最新构建版本 支持switch21.0.0ams1.10.0+
            版本号：v${{ needs.version.outputs.version }}
            包含文件（直接下载使用）：
            - wiliwili-opengl.nro（OpenGL 驱动，兼容性优先，老设备/老CFW首选）
            - wiliwili-deko3d.nro（Deko3D 驱动，性能优先，新设备/大气层1.0+首选）
            - wiliwili-NintendoSwitch.zip（OpenGL 版本，解压后直接放入 SD 卡即可使用）
            
            默认提供的switch安装包为 OpenGL 版本，最高只能播放 4k@30，
            你也可以下载到支持原生图形 api 的 可以流畅播放 4k@60，不过可能会偶尔崩溃。

            使用说明：
            1. 独立 NRO 文件：下载后需改名为 wiliwili.nro，存放路径 sdmc:/switch/wiliwili/wiliwili.nro
            2. ZIP 压缩包：直接解压到 SD 卡根目录，会自动生成 switch/wiliwili/wiliwili.nro（无需手动改名）
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifacts: "./nro-files/*.nro, wiliwili-NintendoSwitch.zip"
