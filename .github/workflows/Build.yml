name: Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write
      
    steps:
      - name: Add safe.directory Update libnx
        run: |
          git config --global --add safe.directory "*"
          # git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          # cd libnx
          # make -j$(nproc) install

      - name: Checkout latest code
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Extract version
        run: |
          APP_NAME="wiliwili"
          VER_FILE="CMakeLists.txt"
          KEY="set(VERSION_"
          VERSION="$(grep -F "$KEY" "$VER_FILE" | grep -oE '[0-9]+' | head -3 | paste -s -d '.')"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"

          echo "TAG_NAME=v${VERSION}-${SHORT_HASH}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${APP_NAME} v${VERSION} (${SHORT_HASH})" >> "$GITHUB_ENV"

      - name: Build OpenGL
        run: |
          chmod +x scripts/build_switch.sh
          bash scripts/build_switch.sh
          mv cmake-build-switch/wiliwili.nro ./wiliwili-opengl.nro

      - name: Build Deko3D
        run: |
          rm -rf cmake-build-switch
          chmod +x scripts/build_switch_deko3d.sh
          bash scripts/build_switch_deko3d.sh
          mv cmake-build-switch/wiliwili.nro ./wiliwili-deko3d.nro

      - name: Pack ZIP (OpenGL)
        run: |
          mkdir -p switch/wiliwili
          cp wiliwili-opengl.nro switch/wiliwili/wiliwili.nro
          zip -r wiliwili-NintendoSwitch.zip switch/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            wiliwili-opengl.nro
            wiliwili-deko3d.nro
            wiliwili-NintendoSwitch.zip
